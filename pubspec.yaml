name: wanandroid_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # 国际化[localizations]
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 路由[https://pub.dev/packages/go_router]
  go_router: ^13.2.1
  # 状态管理[https://pub.dev/packages/provider]
  provider: ^6.1.2
  # 日志打印[https://pub.dev/packages/logger]
  logger: ^2.4.0
  # 轮播图[https://pub.dev/packages/card_swiper]
  card_swiper: ^3.0.1
  # 网络请求[https://pub.dev/packages/dio]
  dio: ^5.5.0+1
  # 配合get_it框架，在编译时生成代码，实现依赖注入[https://pub.dev/packages/injectable]
  injectable: ^2.4.2
  # 实现依赖注入[https://pub.dev/packages/get_it]
  get_it: ^7.7.0
  # 结合dio实现网络请求，编译时生成网络请求的代码[https://pub.dev/packages/retrofit]
  retrofit: ^4.1.0
  # 下拉刷新[https://pub.dev/packages/easy_refresh]
  easy_refresh: ^3.4.0
  # 加载框、toast[https://pub.dev/packages/flutter_easyloading]
  flutter_easyloading: ^3.0.5
  # 加载动画[https://pub.dev/packages/flutter_spinkit]
  flutter_spinkit: ^5.2.1
  # 连接信息[https://pub.dev/packages/connectivity_plus]
  connectivity_plus: ^6.0.3
  # 屏幕适配[https://pub.dev/packages/flutter_screenutil]
  flutter_screenutil: ^5.9.0
  # 图片缓存[https://pub.dev/packages/cached_network_image]
  cached_network_image: ^3.3.1
  # webview[https://pub.dev/packages/webview_flutter]
  webview_flutter: ^4.8.0
  # 轻量级数据存储 [https://pub.dev/packages/shared_preferences]
  shared_preferences: ^2.2.3
  # 事件总线 [https://pub.dev/packages/event_bus]
  event_bus: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  injectable_generator: ^2.6.1
  retrofit_generator: ^8.1.2

flutter:
  uses-material-design: true
  assets:
    - lib/res/images/
  # 国际化[添加代码生成（合成包）支持]
  generate: true

# 国际化[intl]
flutter_intl:
  enabled: true